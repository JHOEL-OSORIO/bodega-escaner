<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1d2330">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escáner Bodega de Garantías</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e3e6eb;--ok:#16803c;--warn:#c27803;--bad:#c4161c;--gray:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;flex:1}
  header button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:6px 10px;font-size:13px}
  main{max-width:560px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit}
  label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;font-size:16px;font-weight:600;margin-top:8px;background:#e9ebef;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}.btn.danger{background:var(--bad);color:#fff}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .modes{display:flex;gap:6px;margin-bottom:8px}
  .modes button{flex:1;padding:10px 4px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:700;color:var(--ink)}
  .modes button.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .help{font-size:13px;color:var(--muted);margin:0 0 8px}
  .cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .aim{position:absolute;left:22%;right:22%;top:12%;bottom:12%;border:3px solid #ffffffcc;border-radius:14px;box-shadow:0 0 0 999px #0005;transition:border-color .15s}
  .cam .aim.hit{border-color:#4ade80}
  .cam .msg{position:absolute;left:0;right:0;bottom:0;color:#fff;text-align:center;padding:7px;font-size:13px;background:#0008}
  .last{border-radius:12px;padding:12px;color:#fff;margin:10px 0;min-height:70px}
  .last b{font-size:22px;display:block}
  .s-VIGENTE{background:var(--ok)}.s-PROXIMO{background:var(--warn)}.s-DESECHAR{background:var(--bad)}.s-SALIO,.s-SIN_FECHA,.s-NADA{background:var(--gray)}
  .counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
  .counts b{display:block;font-size:20px;color:var(--ink)}
  .sync{font-size:13px;color:var(--muted);text-align:right;margin-top:6px;min-height:1em}
  .item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .item .main{flex:1;min-width:0}.item .main div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item small{color:var(--muted)}
  .pill{font-size:12px;padding:3px 8px;border-radius:20px;color:#fff;white-space:nowrap}
  .muted{color:var(--muted);font-size:14px}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:20;max-width:90%}
  .modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal .card{max-width:420px;width:100%}
  a{color:inherit}
</style>
</head>
<body>
<header>
  <h1>📦 Escáner de bodega</h1>
  <button onclick="reload()">🔄 Datos</button>
  <button onclick="openSetup()">⚙️</button>
</header>
<main>
  <!-- CONFIGURACIÓN -->
  <section id="setup" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">Configurar escáner</h3>
      <p class="muted">Se hace una sola vez en cada teléfono.</p>
      <label>Enlace de la app de Google (termina en /exec)</label>
      <input id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      <label>PIN de bodega</label>
      <input id="cfgPin" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
      <label>Tu nombre (queda en el historial)</label>
      <input id="cfgUser" placeholder="Ej: Jhoel">
      <button class="btn primary" onclick="saveSetup()">Guardar y conectar</button>
      <p class="muted" id="setupMsg"></p>
    </div>
  </section>

  <!-- ESCÁNER -->
  <section id="scan" class="hidden">
    <div class="modes">
      <button id="m-CONSULTA" onclick="setMode('CONSULTA')">👁 Consultar</button>
      <button id="m-INVENTARIO" onclick="setMode('INVENTARIO')">✔ Inventario</button>
      <button id="m-DESECHO" onclick="setMode('DESECHO')">🗑 Desecho</button>
    </div>
    <p class="help" id="modeHelp"></p>
    <div class="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="aim" id="aim"></div>
      <div class="msg" id="camMsg">Toca "Iniciar cámara"</div>
    </div>
    <div class="row">
      <button class="btn primary" id="btnCam" onclick="toggleCam()">▶ Iniciar cámara</button>
      <button class="btn" id="btnTorch" onclick="toggleTorch()" style="flex:.45">🔦</button>
    </div>
    <input id="wedge" placeholder="Lector Bluetooth / escribir ID y Enter" style="margin-top:8px" autocomplete="off"
      onkeydown="if(event.key==='Enter'){handleCode(this.value);this.value=''}">
    <div class="last s-NADA" id="lastBox"><b>Listo para escanear</b><span id="dataInfo">Cargando datos…</span></div>
    <div class="card">
      <div class="counts">
        <div><b id="cTot">0</b>Escaneadas</div>
        <div><b id="cOk" style="color:var(--ok)">0</b>Vigentes</div>
        <div><b id="cBad" style="color:var(--bad)">0</b>Desechar</div>
        <div><b id="cNo" style="color:var(--gray)">0</b>No encontradas</div>
      </div>
      <div class="sync" id="syncMsg"></div>
      <button class="btn danger hidden" id="btnApply" onclick="askDesecho()"></button>
      <button class="btn" onclick="newSession()">Nueva sesión (limpiar lista)</button>
    </div>
    <div class="card"><h3 style="margin-top:0">Escaneadas en esta sesión</h3><div id="list"><p class="muted">Aún nada.</p></div></div>
  </section>
</main>

<div class="modal hidden" id="modal"><div class="card">
  <p id="modalText" style="margin-top:0;font-weight:600"></p>
  <div class="row"><button class="btn" onclick="closeModal(false)">Cancelar</button><button class="btn danger" onclick="closeModal(true)">Confirmar</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Configuración guardada en este teléfono ===== */
const LS={get(k){try{return localStorage.getItem('bodega_'+k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem('bodega_'+k,v)}catch(e){}}};
let CFG={url:'',pin:'',user:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}

/* ===== Comunicación con la hoja (Apps Script) ===== */
async function api(action,payload){
  const res=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({action,pin:CFG.pin,usuario:CFG.user},payload||{}))});
  const txt=await res.text();
  let j;try{j=JSON.parse(txt)}catch(e){throw new Error('Respuesta inesperada. Revisa que la app esté implementada con acceso "Cualquier usuario".')}
  if(!j.ok)throw new Error(j.error||'Error');
  return j.data;
}

/* ===== Datos ===== */
let DATA={},HOY='',APPURL='';
async function reload(force){
  $('dataInfo').textContent='Cargando datos de la hoja…';
  try{
    const d=await api('boot',{force:force!==false});
    DATA={};d.registros.forEach(o=>DATA[o.id.toUpperCase()]=o);HOY=d.hoy;APPURL=d.url;
    $('dataInfo').textContent=`${d.registros.length} cajas cargadas · ${new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})}`;
    return true;
  }catch(e){$('dataInfo').textContent='⚠ '+e.message;toast(e.message);return false}
}

/* ===== Configuración ===== */
function openSetup(){
  $('cfgUrl').value=CFG.url;$('cfgPin').value=CFG.pin;$('cfgUser').value=CFG.user;
  $('setup').classList.remove('hidden');$('scan').classList.add('hidden');stopCam();
}
async function saveSetup(){
  CFG.url=$('cfgUrl').value.trim();CFG.pin=$('cfgPin').value.trim();CFG.user=$('cfgUser').value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(CFG.url)){$('setupMsg').textContent='El enlace debe empezar con https://script.google.com/ y terminar en /exec';return}
  $('setupMsg').textContent='Conectando…';
  try{await api('ping');}catch(e){$('setupMsg').textContent='⚠ '+e.message;return}
  LS.set('url',CFG.url);LS.set('pin',CFG.pin);LS.set('user',CFG.user);
  $('setupMsg').textContent='';showScan();reload(false);
}
function showScan(){$('setup').classList.add('hidden');$('scan').classList.remove('hidden')}

/* ===== Modos ===== */
let MODE='CONSULTA';
const ST={VIGENTE:{t:'VIGENTE',c:'var(--ok)'},PROXIMO:{t:'VENCE PRONTO',c:'var(--warn)'},DESECHAR:{t:'DESECHAR',c:'var(--bad)'},SALIO:{t:'YA SALIÓ',c:'var(--gray)'},SIN_FECHA:{t:'SIN FECHA',c:'var(--gray)'}};
const HELP={CONSULTA:'Solo muestra el estado de cada caja. No cambia nada en la hoja.',
  INVENTARIO:'Cada caja escaneada se marca como "Verificada" (columna INVENTARIO) y se guarda sola en la hoja.',
  DESECHO:'Junta las cajas VENCIDAS que escanees. Al final tocas el botón rojo y se marcan como enviadas a gestor de desecho. Las vigentes nunca se agregan.'};
function setMode(m){MODE=m;LS.set('mode',m);['CONSULTA','INVENTARIO','DESECHO'].forEach(x=>$('m-'+x).classList.toggle('on',x===m));$('modeHelp').textContent=HELP[m];updateApply()}

/* ===== Cámara en vivo ===== */
let STREAM=null,TRACK=null,DETECTOR=null,TIMER=null,TORCH=false;
const CANVAS=document.createElement('canvas'),CTX=CANVAS.getContext('2d',{willReadFrequently:true});
async function startCam(){
  try{
    if(!DETECTOR&&'BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))DETECTOR=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
    STREAM=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    TRACK=STREAM.getVideoTracks()[0];
    const v=$('video');v.srcObject=STREAM;await v.play();
    $('camMsg').textContent='Escaneo continuo activo — apunta a la etiqueta';$('btnCam').textContent='⏸ Pausar cámara';
    try{getAudio()}catch(e){}
    tick();
  }catch(e){$('camMsg').textContent='No se pudo abrir la cámara: '+(e.name==='NotAllowedError'?'permiso denegado (revisa permisos del navegador)':e.message)}
}
function stopCam(){clearTimeout(TIMER);TIMER=null;if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null;TRACK=null}$('btnCam').textContent='▶ Iniciar cámara';$('camMsg').textContent='Cámara en pausa';TORCH=false}
function toggleCam(){STREAM?stopCam():startCam()}
async function toggleTorch(){
  if(!TRACK){toast('Primero inicia la cámara');return}
  try{TORCH=!TORCH;await TRACK.applyConstraints({advanced:[{torch:TORCH}]})}catch(e){TORCH=false;toast('Este teléfono no permite usar la linterna desde el navegador')}
}
async function decode(v){
  if(DETECTOR){try{const r=await DETECTOR.detect(v);return r.length?r[0].rawValue:null}catch(e){}}
  const w=v.videoWidth,h=v.videoHeight;if(!w)return null;
  const sc=Math.min(1,800/Math.max(w,h));CANVAS.width=Math.round(w*sc);CANVAS.height=Math.round(h*sc);
  CTX.drawImage(v,0,0,CANVAS.width,CANVAS.height);
  const d=CTX.getImageData(0,0,CANVAS.width,CANVAS.height);
  const r=jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});return r?r.data:null;
}
async function tick(){
  const v=$('video');
  if(STREAM&&v.readyState>=2){const t=await decode(v);if(t)handleCode(t)}
  if(STREAM)TIMER=setTimeout(tick,150);
}

/* ===== Lógica de escaneo ===== */
let SESSION=[],SEEN={},LAST={},PEND_INV=[],FLUSHING=false,FT=null;
function extractId(t){t=String(t||'').trim();const m=t.match(/[?&]id=([^&#\s]+)/i);try{return decodeURIComponent(m?m[1]:t).trim().toUpperCase()}catch(e){return t.toUpperCase()}}
function handleCode(text){
  const id=extractId(text);if(!id)return;
  const now=Date.now();if(LAST[id]&&now-LAST[id]<3000)return;LAST[id]=now;
  flashAim();
  const o=DATA[id];
  if(!o){beep('bad');showLast(null,`${id} no está en la hoja`);if(!SEEN[id]){SEEN[id]={id,nf:true};SESSION.unshift(SEEN[id])}render();return}
  const repeat=!!SEEN[id];if(!repeat){SEEN[id]={id,o};SESSION.unshift(SEEN[id])}
  const e=SEEN[id];let note='';
  if(MODE==='INVENTARIO'&&o.semaforo!=='SALIO'){
    if(!o.inventario&&!e.inv){e.inv=true;PEND_INV.push(id);note=' · ✔ marcada en inventario';scheduleFlush()}else note=' · ya estaba verificada';
  }
  if(MODE==='DESECHO'){
    if(o.semaforo==='DESECHAR'){note=e.queued?' · ya está en el lote':' · agregada al lote de desecho';e.queued=true}
    else if(o.semaforo!=='SALIO')note=' · VIGENTE: no se agrega';
  }
  beep(o.semaforo==='DESECHAR'?'warn':o.semaforo==='SALIO'?'bad':'ok');
  showLast(o,(repeat?'(repetida) ':'')+note);render();updateApply();
}
function showLast(o,extra){
  const b=$('lastBox');
  if(!o){b.className='last s-SIN_FECHA';b.innerHTML=`<b>⚠ No encontrada</b><span>${esc(extra)}</span>`;return}
  const s=ST[o.semaforo]||ST.SIN_FECHA;
  const d=o.semaforo==='SALIO'?esc(o.estado):(o.dias==null?'sin fecha':(o.dias<0?`venció hace ${-o.dias} días (${esc(o.limite)})`:`faltan ${o.dias} días · desechar desde ${esc(o.limite)}`));
  b.className='last s-'+o.semaforo;
  b.innerHTML=`<b>${s.t} · ${esc(o.id)}</b><span>OR ${esc(o.or)} · ${esc(o.detalle)} · ${esc(o.ubicacion||'—')}<br>${d}${esc(extra||'')}</span>`;
}
function render(){
  const f=SESSION.filter(e=>!e.nf);
  $('cTot').textContent=SESSION.length;
  $('cOk').textContent=f.filter(e=>e.o.semaforo==='VIGENTE'||e.o.semaforo==='PROXIMO').length;
  $('cBad').textContent=f.filter(e=>e.o.semaforo==='DESECHAR').length;
  $('cNo').textContent=SESSION.length-f.length;
  $('list').innerHTML=SESSION.length?SESSION.slice(0,300).map(e=>{
    if(e.nf)return `<div class="item"><span class="dot" style="background:var(--gray)"></span><div class="main"><div><b>${esc(e.id)}</b></div><small>No está en la hoja</small></div></div>`;
    const o=e.o,s=ST[o.semaforo]||ST.SIN_FECHA,tag=e.queued&&o.semaforo==='DESECHAR'?'🗑 en lote':e.inv?'✔ inventario':s.t;
    const link=APPURL?`<a href="${esc(APPURL)}?id=${encodeURIComponent(o.id)}" target="_blank" rel="noopener">${esc(o.or)}</a>`:esc(o.or);
    return `<div class="item"><span class="dot" style="background:${s.c}"></span><div class="main"><div><b>${link}</b> · ${esc(o.detalle)}</div><small>${esc(o.id)} · ${esc(o.ubicacion||'—')} · límite ${esc(o.limite||'—')}</small></div><span class="pill" style="background:${s.c}">${esc(tag)}</span></div>`;
  }).join(''):'<p class="muted">Aún nada.</p>';
}
function queued(){return SESSION.filter(e=>e.queued&&e.o&&e.o.semaforo==='DESECHAR')}
function updateApply(){const n=queued().length,b=$('btnApply');b.classList.toggle('hidden',!(MODE==='DESECHO'&&n));b.textContent=`🗑 Enviar ${n} caja(s) vencida(s) a gestor de desecho`}

/* Inventario: se guarda en lotes cada pocos segundos */
function scheduleFlush(){$('syncMsg').textContent=`Guardando ${PEND_INV.length} en la hoja…`;clearTimeout(FT);FT=setTimeout(flush,2000)}
async function flush(){
  if(FLUSHING||!PEND_INV.length)return;FLUSHING=true;const batch=PEND_INV.splice(0);
  try{const r=await api('bulk',{ids:batch,accion:'INVENTARIO'});batch.forEach(id=>{if(DATA[id])DATA[id].inventario=true});
    $('syncMsg').textContent=`✔ ${r.aplicadas} guardadas en la hoja · ${new Date().toLocaleTimeString('es-EC')}`}
  catch(e){PEND_INV.unshift(...batch);$('syncMsg').textContent='⚠ Sin conexión, reintentando… ('+e.message+')';setTimeout(flush,5000)}
  finally{FLUSHING=false;if(PEND_INV.length)scheduleFlush()}
}

/* Desecho: se confirma al final */
let MODAL_CB=null;
function confirmBox(text,cb){$('modalText').textContent=text;MODAL_CB=cb;$('modal').classList.remove('hidden')}
function closeModal(ok){$('modal').classList.add('hidden');const cb=MODAL_CB;MODAL_CB=null;if(ok&&cb)cb()}
function askDesecho(){const q=queued();if(!q.length)return;confirmBox(`¿Marcar ${q.length} caja(s) vencida(s) como ENVIADAS A GESTOR DESECHO con fecha de hoy (${HOY})?`,()=>doDesecho(q))}
async function doDesecho(q){
  $('syncMsg').textContent='Guardando desecho…';
  try{const r=await api('bulk',{ids:q.map(e=>e.id),accion:'DESECHO'});
    q.forEach(e=>{if(r.ids.includes(e.id)){e.queued=false;Object.assign(e.o,{semaforo:'SALIO',estado:'ENTREGADO/ENVIADO A GESTOR DESECHO'})}});
    render();updateApply();$('syncMsg').textContent=`✔ ${r.aplicadas} cajas marcadas como desechadas en la hoja`;toast(`✔ ${r.aplicadas} cajas enviadas a desecho`)}
  catch(e){$('syncMsg').textContent='⚠ '+e.message;toast(e.message)}
}
function newSession(){
  const q=queued().length;
  const go=()=>{SESSION=[];SEEN={};LAST={};render();updateApply();$('lastBox').className='last s-NADA';$('lastBox').innerHTML='<b>Listo para escanear</b><span>Nueva sesión</span>'};
  q?confirmBox(`Hay ${q} caja(s) en el lote de desecho sin enviar. ¿Borrar la lista de todos modos?`,go):go();
}

/* ===== Sonido y vibración ===== */
let AC=null;function getAudio(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(kind){
  try{navigator.vibrate&&navigator.vibrate(kind==='ok'?60:kind==='warn'?[90,60,90]:[300])}catch(e){}
  try{const ac=getAudio(),tones=kind==='ok'?[1000]:kind==='warn'?[440,440]:[200];
    tones.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
      const t=ac.currentTime+i*0.2;g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);o.start(t);o.stop(t+0.17)})}catch(e){}
}
function flashAim(){const a=$('aim');a.classList.add('hit');setTimeout(()=>a.classList.remove('hit'),250)}

/* ===== Inicio ===== */
document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();if(STREAM)stopCam()}});
(function init(){
  CFG={url:LS.get('url'),pin:LS.get('pin'),user:LS.get('user')};
  // permite compartir el enlace ya configurado: .../?app=URL_EXEC
  const p=new URLSearchParams(location.search).get('app');if(p&&!CFG.url)CFG.url=p;
  setMode(LS.get('mode')||'CONSULTA');
  if(CFG.url&&CFG.pin){showScan();reload(false)}else openSetup();
})();
</script>
</body>
</html>
